<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Barbería | BarberBook.com</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <a th:href="@{/cliente}" class="btn btn-link ps-0">&laquo; Volver a barberías</a>

    <h2 th:text="${barberia.nombre}"></h2>
    <p class="text-muted">
        <span th:text="${barberia.direccion}"></span> ·
        <span th:text="${barberia.telefono}"></span> ·
        <span th:text="${barberia.horario}"></span>
    </p>

    <h4 class="mt-4">Servicios</h4>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Servicio</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${servicios}">
            <td th:text="${s.nombre}"></td>
            <td th:text="${s.descripcion}"></td>
            <td th:text="${'$' + #numbers.formatDecimal(s.precio, 0, 'POINT', 2, 'COMMA')}"></td>
            <td>
                <a th:href="@{/cliente/reservas/nueva(servicioId=${s.id})}" class="btn btn-success btn-sm">Reservar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(servicios)}">
            <td colspan="4" class="text-center">Esta barbería aún no tiene servicios publicados.</td>
        </tr>
        </tbody>
    </table>

    <h4 class="mt-4">Barberos</h4>
    <ul class="list-group mb-4">
        <li class="list-group-item" th:each="b : ${barberos}" th:text="${b.nombre}"></li>
        <li class="list-group-item" th:if="${#lists.isEmpty(barberos)}">Esta barbería aún no tiene barberos asignados.</li>
    </ul>
</div>
</body>
</html>
