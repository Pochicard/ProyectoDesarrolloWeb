<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Barberos | BarberBook.com</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-1">
        <h2>Barberos</h2>
        <a th:href="@{/gerente/barberos/nuevo}" class="btn btn-primary" th:if="${barberia.activo}">Nuevo Barbero</a>
    </div>
    <p class="text-muted" th:text="${barberia.nombre}"></p>

    <div class="alert alert-danger" th:unless="${barberia.activo}">
        Tu barbería está <strong>desactivada</strong> por el administrador del sistema.
        Puedes consultar la información, pero no hacer cambios ni recibir reservas nuevas.
    </div>


    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Teléfono</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b : ${barberos}">
            <td th:text="${b.id}"></td>
            <td th:text="${b.nombre}"></td>
            <td th:text="${b.correo}"></td>
            <td th:text="${b.telefono}"></td>
            <td th:text="${b.activo ? 'Activo' : 'Inactivo'}"></td>
            <td>
                <a th:href="@{/gerente/barberos/editar/{id}(id=${b.id})}" class="btn btn-warning btn-sm" th:if="${barberia.activo}">Editar</a>
                <a th:if="${b.activo and barberia.activo}" th:href="@{/gerente/barberos/desactivar/{id}(id=${b.id})}"
                   class="btn btn-danger btn-sm" onclick="return confirm('¿Dar de baja a este barbero?');">Dar de baja</a>
                <a th:if="${!b.activo and barberia.activo}" th:href="@{/gerente/barberos/activar/{id}(id=${b.id})}"
                   class="btn btn-success btn-sm">Dar de alta</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(barberos)}">
            <td colspan="6" class="text-center">Aún no tienes barberos. Registra el primero.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
