<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión | BarberBook.com</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border border-primary border-2" style="--bs-card-border-radius: 1rem;">
            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0">BarberBook.com</h4>
            </div>
            <div class="card-body">
                <h5 class="card-title mb-3">Iniciar sesión</h5>
                <p class="text-muted">Reserva tu cita en las mejores barberías de la ciudad.</p>

                <div class="alert alert-success" th:if="${param.registrado != null}">
                    Cuenta creada correctamente. Ya puedes iniciar sesión.
                </div>
                <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Correo:</label>
                        <input type="email" name="correo" th:value="${correo}" class="form-control" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña:</label>
                        <input type="password" name="password" class="form-control" required />
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>

                <hr>
                <p class="text-center mb-0">
                    ¿No tienes cuenta? <a th:href="@{/registro}">Regístrate como cliente</a>
                </p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
