<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Reserva</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4>Detalle de Reserva</h4>
            </div>
            <div class="card-body">
                <p><strong>ID:</strong> <span th:text="${reserva.id}"></span></p>
                <p><strong>Usuario:</strong>
                    <span th:text="${reserva.usuario != null ? reserva.usuario.nombre : 'Sin usuario'}"></span>
                </p>
                <p><strong>Correo:</strong>
                    <span th:text="${reserva.usuario != null ? reserva.usuario.correo : '-'}"></span>
                </p>
                <p><strong>Espacio:</strong>
                    <span th:text="${reserva.espacio != null ? reserva.espacio.nombre : 'Sin espacio'}"></span>
                </p>
                <p><strong>Fecha:</strong> <span th:text="${reserva.fecha}"></span></p>
                <p><strong>Hora:</strong> <span th:text="${reserva.hora}"></span></p>

                <hr>

                <p><strong>Estado del pago:</strong>
                    <span th:if="${pago != null}" class="badge"
                          th:classappend="${pago.estado == 'COMPLETADO'} ? 'bg-success' : 'bg-warning text-dark'"
                          th:text="${pago.estado}"></span>
                    <span th:if="${pago == null}" class="badge bg-secondary">SIN PAGO</span>
                </p>
                <p th:if="${pago != null}"><strong>Monto:</strong>
                    <span th:text="${'$' + #numbers.formatDecimal(pago.monto, 0, 'POINT', 2, 'COMMA')}"></span>
                </p>
                <p th:if="${pago != null}"><strong>Método:</strong>
                    <span th:text="${pago.metodoPago}"></span>
                </p>
                <a th:if="${pago == null}" th:href="@{/pagos/nuevo(reservaId=${reserva.id})}"
                   class="btn btn-success">Registrar pago</a>
                <a th:unless="${pago == null}" th:href="@{/pagos/editar/{id}(id=${pago.id})}"
                   class="btn btn-outline-success">Editar pago</a>

                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{/reservas}" class="btn btn-secondary">Volver al listado</a>
                    <a th:href="@{/reservas/editar/{id}(id=${reserva.id})}" class="btn btn-warning">Editar</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
