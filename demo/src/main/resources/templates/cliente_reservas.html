<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Reservas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <h2 class="mb-4">Mis reservas</h2>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Barbería</th>
            <th>Servicio</th>
            <th>Barbero</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Pago</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${reservas}">
            <td th:text="${r.servicio.barberia.nombre}"></td>
            <td th:text="${r.servicio.nombre}"></td>
            <td th:text="${r.barbero.nombre}"></td>
            <td th:text="${r.fecha}"></td>
            <td th:text="${r.hora}"></td>
            <td>
                <span th:if="${pagos[r.id] != null}" class="badge"
                      th:classappend="${pagos[r.id].estado == 'COMPLETADO'} ? 'bg-success' : 'bg-warning text-dark'"
                      th:text="${pagos[r.id].estado}"></span>
                <span th:if="${pagos[r.id] == null}" class="badge bg-secondary">SIN PAGO</span>
            </td>
            <td>
                <a th:if="${pagos[r.id] == null}" th:href="@{/cliente/pagos/nuevo(reservaId=${r.id})}"
                   class="btn btn-success btn-sm">Pagar</a>
                <a th:href="@{/cliente/reservas/cancelar/{id}(id=${r.id})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Cancelar esta reserva?');">Cancelar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(reservas)}">
            <td colspan="7" class="text-center">Todavía no tienes reservas. Elige una barbería para comenzar.</td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/cliente}" class="btn btn-primary">Ver barberías</a>
</div>
</body>
</html>
