<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Barbero | BarberBook.com</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${barbero.id == null ? 'Nuevo Barbero' : 'Editar Barbero'}">Barbero</h4>
                </div>
                <div class="card-body">
                    <p class="text-muted" th:text="${barbero.barberia.nombre}"></p>

                    <form th:action="@{/gerente/barberos/guardar}" th:object="${barbero}" method="post" novalidate>
                        <input type="hidden" th:field="*{id}" />
                        <input type="hidden" th:field="*{rol}" />
                        <input type="hidden" th:field="*{activo}" />

                        <div class="mb-3">
                            <label class="form-label">Nombre:</label>
                            <input type="text" th:field="*{nombre}" class="form-control" />
                            <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Correo:</label>
                            <input type="text" th:field="*{correo}" class="form-control" />
                            <div class="text-danger" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Contraseña:</label>
                            <input type="text" th:field="*{password}" class="form-control" />
                            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Teléfono:</label>
                            <input type="text" th:field="*{telefono}" class="form-control" />
                            <div class="text-danger" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/gerente/barberos}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar Barbero</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
