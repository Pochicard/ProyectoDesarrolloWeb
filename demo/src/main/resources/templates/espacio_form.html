<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Espacio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 th:text="${espacio.id == null ? 'Crear Espacio' : 'Editar Espacio'}">Espacio</h4>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/espacios/guardar}" th:object="${espacio}" method="post">
                    <!-- ID y estado ocultos para que la edición no pise estos valores -->
                    <input type="hidden" th:field="*{id}" />
                    <input type="hidden" th:field="*{activo}" />

                    <div class="mb-3">
                        <label class="form-label">Barbería:</label>
                        <select th:field="*{barberia.id}" class="form-select" required>
                            <option value="">-- Seleccionar Barbería --</option>
                            <option th:each="b : ${barberias}" th:value="${b.id}" th:text="${b.nombre}"></option>
                        </select>
                        <div class="text-danger" th:if="${#fields.hasErrors('barberia')}" th:errors="*{barberia}"></div>
                    </div>

                    <!-- Campo Nombre -->
                    <div class="mb-3">
                        <label class="form-label">Nombre del Espacio:</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required />
                        <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                    </div>

                    <!-- Campo Capacidad -->
                    <div class="mb-3">
                        <label class="form-label">Capacidad:</label>
                        <input type="number" th:field="*{capacidad}" class="form-control" required min="1" />
                        <div class="text-danger" th:if="${#fields.hasErrors('capacidad')}" th:errors="*{capacidad}"></div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/admin/espacios}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar Espacio</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</div>
</body>
</html>
