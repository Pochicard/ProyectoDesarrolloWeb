<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Barberías | BarberBook.com</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <h2 class="mb-4">Barberías disponibles</h2>

    <div class="row g-3">
        <div class="col-md-6" th:each="b : ${barberias}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${b.nombre}"></h5>
                    <p class="card-text mb-1"><strong>Dirección:</strong> <span th:text="${b.direccion}"></span></p>
                    <p class="card-text mb-1"><strong>Teléfono:</strong> <span th:text="${b.telefono}"></span></p>
                    <p class="card-text"><strong>Horario:</strong> <span th:text="${b.horario}"></span></p>
                    <a th:href="@{/cliente/barberias/{id}(id=${b.id})}" class="btn btn-primary">Ver servicios</a>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(barberias)}">
            <div class="alert alert-info">No hay barberías disponibles por el momento.</div>
        </div>
    </div>
</div>
</body>
</html>
