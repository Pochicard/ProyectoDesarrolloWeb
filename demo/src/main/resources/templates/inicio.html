<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Barbería de Rocío</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border border-primary border-2" style="--bs-card-border-radius: 1rem;">
            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0">Barbería de Rocío</h4>
            </div>
            <div class="card-body d-grid gap-3">
                <a th:href="@{/reservas}" class="btn btn-outline-primary rounded-3">Ver reservas</a>
                <a th:href="@{/reservas/nueva}" class="btn btn-outline-primary rounded-3">Nueva reserva</a>
                <a th:href="@{/usuarios}" class="btn btn-outline-primary rounded-3">Gestión de usuarios</a>
                <a th:href="@{/admin/espacios}" class="btn btn-outline-primary rounded-3">Gestión de espacios</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
