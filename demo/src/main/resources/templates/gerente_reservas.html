<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reservas de mi Barbería | BarberBook.com</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <h2 class="mb-1">Reservas</h2>
    <p class="text-muted" th:text="${barberia.nombre}"></p>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Barbero</th>
            <th>Servicio</th>
            <th>Espacio</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Pago</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${reservas}">
            <td th:text="${r.id}"></td>
            <td th:text="${r.usuario.nombre}"></td>
            <td th:text="${r.barbero.nombre}"></td>
            <td th:text="${r.servicio.nombre}"></td>
            <td th:text="${r.espacio.nombre}"></td>
            <td th:text="${r.fecha}"></td>
            <td th:text="${r.hora}"></td>
            <td>
                <span th:if="${pagos[r.id] != null}" class="badge"
                      th:classappend="${pagos[r.id].estado == 'COMPLETADO'} ? 'bg-success' : 'bg-warning text-dark'"
                      th:text="${pagos[r.id].estado}"></span>
                <span th:if="${pagos[r.id] == null}" class="badge bg-secondary">SIN PAGO</span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(reservas)}">
            <td colspan="8" class="text-center">Tu barbería aún no tiene reservas.</td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/gerente/agenda}" class="btn btn-primary">Ver agenda por día</a>
</div>
</body>
</html>
