<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Barberías</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestión de Barberías</h2>
        <a th:href="@{/admin/barberias/nueva}" class="btn btn-primary">Nueva Barbería</a>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Dirección</th>
            <th>Teléfono</th>
            <th>Horario</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b : ${barberias}">
            <td th:text="${b.id}"></td>
            <td th:text="${b.nombre}"></td>
            <td th:text="${b.direccion}"></td>
            <td th:text="${b.telefono}"></td>
            <td th:text="${b.horario}"></td>
            <td th:text="${b.activo ? 'Activa' : 'Inactiva'}"></td>
            <td>
                <a th:href="@{/admin/barberias/editar/{id}(id=${b.id})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:if="${b.activo}" th:href="@{/admin/barberias/desactivar/{id}(id=${b.id})}"
                   class="btn btn-danger btn-sm" onclick="return confirm('¿Desactivar esta barbería?');">Desactivar</a>
                <a th:unless="${b.activo}" th:href="@{/admin/barberias/activar/{id}(id=${b.id})}"
                   class="btn btn-success btn-sm">Activar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(barberias)}">
            <td colspan="7" class="text-center">No hay barberías registradas.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
