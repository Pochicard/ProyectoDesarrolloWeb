<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Barbería | BarberBook.com</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${barberia.id == null ? 'Crear Barbería' : 'Editar Barbería'}">Barbería</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/barberias/guardar}" th:object="${barberia}" method="post" novalidate>
                        <input type="hidden" th:field="*{id}" />
                        <input type="hidden" th:field="*{activo}" />

                        <div class="mb-3">
                            <label class="form-label">Nombre:</label>
                            <input type="text" th:field="*{nombre}" class="form-control" />
                            <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Dirección:</label>
                            <input type="text" th:field="*{direccion}" class="form-control" />
                            <div class="text-danger" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Teléfono:</label>
                            <input type="text" th:field="*{telefono}" class="form-control" />
                            <div class="text-danger" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Horario:</label>
                            <input type="text" th:field="*{horario}" class="form-control"
                                   placeholder="Lunes a Sábado 9:00 - 19:00" />
                            <div class="text-danger" th:if="${#fields.hasErrors('horario')}" th:errors="*{horario}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/admin/barberias}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar Barbería</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
