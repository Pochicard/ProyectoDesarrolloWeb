<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Espacio | BarberBook.com</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${espacio.id == null ? 'Nuevo Espacio' : 'Editar Espacio'}">Espacio</h4>
                </div>
                <div class="card-body">
                    <p class="text-muted" th:text="${espacio.barberia.nombre}"></p>

                    <form th:action="@{/gerente/espacios/guardar}" th:object="${espacio}" method="post" novalidate>
                        <input type="hidden" th:field="*{id}" />
                        <input type="hidden" th:field="*{activo}" />

                        <div class="mb-3">
                            <label class="form-label">Nombre del espacio:</label>
                            <input type="text" th:field="*{nombre}" class="form-control"
                                   placeholder="Silla 1, Estación Lavacabezas..." />
                            <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Capacidad:</label>
                            <input type="number" min="1" th:field="*{capacidad}" class="form-control" />
                            <div class="text-danger" th:if="${#fields.hasErrors('capacidad')}" th:errors="*{capacidad}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/gerente/espacios}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar Espacio</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
