<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Servicio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${servicio.id == null ? 'Nuevo Servicio' : 'Editar Servicio'}">Servicio</h4>
                </div>
                <div class="card-body">
                    <p class="text-muted" th:text="${servicio.barberia.nombre}"></p>

                    <form th:action="@{/gerente/servicios/guardar}" th:object="${servicio}" method="post" novalidate>
                        <input type="hidden" th:field="*{id}" />
                        <input type="hidden" th:field="*{activo}" />

                        <div class="mb-3">
                            <label class="form-label">Nombre:</label>
                            <input type="text" th:field="*{nombre}" class="form-control" />
                            <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción:</label>
                            <input type="text" th:field="*{descripcion}" class="form-control" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Precio:</label>
                            <input type="number" step="0.01" min="0" th:field="*{precio}" class="form-control" />
                            <div class="text-danger" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/gerente/servicios}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar Servicio</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
