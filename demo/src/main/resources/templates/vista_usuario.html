<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Usuario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 th:text="${usuario.id == null ? 'Nuevo Usuario' : 'Editar Usuario'}">Usuario</h4>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/usuarios/guardar}" th:object="${usuario}" method="post" novalidate>
                    <input type="hidden" th:field="*{id}" />
                    <input type="hidden" th:field="*{activo}" />
                    <div class="mb-3">
                        <label class="form-label">Nombre:</label>
                        <input type="text" th:field="*{nombre}" class="form-control" />
                        <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo:</label>
                        <input type="text" th:field="*{correo}" class="form-control" />
                        <div class="text-danger" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contraseña:</label>
                        <input type="text" th:field="*{password}" class="form-control" />
                        <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Teléfono:</label>
                        <input type="text" th:field="*{telefono}" class="form-control" />
                        <div class="text-danger" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Rol:</label>
                        <select th:field="*{rol}" class="form-select" required>
                            <option value="">-- Seleccionar Rol --</option>
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                        </select>
                        <div class="text-danger" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Barbería (solo para barberos):</label>
                        <select th:field="*{barberia.id}" class="form-select">
                            <option value="">-- Sin barbería --</option>
                            <option th:each="b : ${barberias}" th:value="${b.id}" th:text="${b.nombre}"></option>
                        </select>
                        <div class="text-danger" th:if="${#fields.hasErrors('barberia')}" th:errors="*{barberia}"></div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/admin/usuarios}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar Usuario</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</div>
</body>
</html>
