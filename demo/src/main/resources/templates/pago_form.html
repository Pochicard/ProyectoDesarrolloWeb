<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Pago</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 th:text="${pago.id == null ? 'Registrar Pago' : 'Editar Pago'}">Pago</h4>
            </div>
            <div class="card-body">
                <form th:action="@{/pagos/guardar}" th:object="${pago}" method="post">
                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-3">
                        <label class="form-label">Reserva:</label>
                        <select th:field="*{reserva.id}" class="form-select" required>
                            <option value="">-- Seleccionar Reserva --</option>
                            <option th:each="r : ${reservas}" th:value="${r.id}"
                                    th:text="${'#' + r.id + ' - ' + r.usuario.nombre + ' - ' + r.fecha.toString() + ' ' + r.hora.toString()}"></option>
                        </select>
                        <div class="text-danger" th:if="${#fields.hasErrors('reserva')}" th:errors="*{reserva}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Monto:</label>
                        <input type="number" step="0.01" min="0" th:field="*{monto}" class="form-control" required />
                        <div class="text-danger" th:if="${#fields.hasErrors('monto')}" th:errors="*{monto}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Método de Pago:</label>
                        <select th:field="*{metodoPago}" class="form-select" required>
                            <option value="">-- Seleccionar Método --</option>
                            <option value="Efectivo">Efectivo</option>
                            <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
                            <option value="Transferencia">Transferencia</option>
                        </select>
                        <div class="text-danger" th:if="${#fields.hasErrors('metodoPago')}" th:errors="*{metodoPago}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Estado:</label>
                        <select th:field="*{estado}" class="form-select" required>
                            <option value="">-- Seleccionar Estado --</option>
                            <option value="PENDIENTE">PENDIENTE</option>
                            <option value="COMPLETADO">COMPLETADO</option>
                        </select>
                        <div class="text-danger" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/pagos}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar Pago</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
