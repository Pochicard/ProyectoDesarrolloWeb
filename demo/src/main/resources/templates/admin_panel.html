<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <h2 class="mb-4">Panel de administración</h2>

    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h3 th:text="${totalBarberias}">0</h3>
                    <p class="text-muted mb-0">Barberías</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h3 th:text="${totalUsuarios}">0</h3>
                    <p class="text-muted mb-0">Usuarios</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h3 th:text="${totalBarberos}">0</h3>
                    <p class="text-muted mb-0">Barberos</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h3 th:text="${totalReservas}">0</h3>
                    <p class="text-muted mb-0">Reservas</p>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body d-grid gap-2">
            <a th:href="@{/admin/barberias}" class="btn btn-outline-primary">Gestionar barberías</a>
            <a th:href="@{/admin/usuarios}" class="btn btn-outline-primary">Gestionar usuarios y barberos</a>
            <a th:href="@{/admin/servicios}" class="btn btn-outline-primary">Gestionar servicios</a>
            <a th:href="@{/admin/espacios}" class="btn btn-outline-primary">Gestionar espacios</a>
            <a th:href="@{/admin/reservas}" class="btn btn-outline-primary">Gestionar reservas</a>
            <a th:href="@{/admin/pagos}" class="btn btn-outline-primary">Gestionar pagos</a>
            <a th:href="@{/admin/reportes}" class="btn btn-outline-primary">Reporte de ingresos</a>
        </div>
    </div>
</div>
</body>
</html>
