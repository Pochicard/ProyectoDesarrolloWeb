<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Ingresos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <h2 class="mb-1">Barberías por ingresos</h2>
    <p class="text-muted">Solo se cuentan los pagos en estado COMPLETADO.</p>

    <form th:action="@{/admin/reportes}" method="get" class="row g-2 align-items-center mb-4">
        <div class="col-auto">
            <label class="col-form-label">Ingresos mayores a:</label>
        </div>
        <div class="col-auto">
            <input type="number" name="minimo" th:value="${minimo}" step="1000" min="0" class="form-control" />
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">Consultar</button>
        </div>
    </form>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Barbería</th>
            <th>Total recaudado</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${resumen}">
            <td th:text="${r.nombre}"></td>
            <td class="text-success fw-bold"
                th:text="${'$' + #numbers.formatDecimal(r.total, 0, 'POINT', 2, 'COMMA')}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(resumen)}">
            <td colspan="2" class="text-center">
                Ninguna barbería supera ese monto.
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
