<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Reserva | BarberBook.com</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Reservar servicio</h4>
                </div>
                <div class="card-body">
                    <p class="mb-1"><strong>Barbería:</strong> <span th:text="${servicio.barberia.nombre}"></span></p>
                    <p class="mb-1"><strong>Servicio:</strong> <span th:text="${servicio.nombre}"></span></p>
                    <p><strong>Precio:</strong>
                        <span th:text="${'$' + #numbers.formatDecimal(servicio.precio, 0, 'POINT', 2, 'COMMA')}"></span>
                    </p>
                    <hr>

                    <div class="alert alert-warning"
                         th:if="${#lists.isEmpty(barberos) or #lists.isEmpty(espacios)}">
                        Esta barbería todavía no tiene
                        <span th:if="${#lists.isEmpty(barberos)}">barberos disponibles</span>
                        <span th:if="${#lists.isEmpty(barberos) and #lists.isEmpty(espacios)}">ni</span>
                        <span th:if="${#lists.isEmpty(espacios)}">espacios de trabajo</span>,
                        por lo que no se puede reservar por ahora.
                    </div>

                    <form th:action="@{/cliente/reservas/guardar}" th:object="${reserva}" method="post">
                        <input type="hidden" th:field="*{usuario.id}" />
                        <input type="hidden" th:field="*{servicio.id}" />

                        <div class="mb-3">
                            <label class="form-label">Barbero:</label>
                            <select th:field="*{barbero.id}" class="form-select" required>
                                <option value="">-- Seleccionar Barbero --</option>
                                <option th:each="b : ${barberos}" th:value="${b.id}" th:text="${b.nombre}"></option>
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('barbero')}" th:errors="*{barbero}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Espacio:</label>
                            <select th:field="*{espacio.id}" class="form-select" required>
                                <option value="">-- Seleccionar Espacio --</option>
                                <option th:each="e : ${espacios}" th:value="${e.id}" th:text="${e.nombre}"></option>
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('espacio')}" th:errors="*{espacio}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Fecha:</label>
                            <input type="date" th:field="*{fecha}" class="form-control" required />
                            <div class="text-danger" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Hora:</label>
                            <input type="time" th:field="*{hora}" class="form-control" required />
                            <div class="text-danger" th:if="${#fields.hasErrors('hora')}" th:errors="*{hora}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/cliente/barberias/{id}(id=${servicio.barberia.id})}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success"
                                    th:disabled="${#lists.isEmpty(barberos) or #lists.isEmpty(espacios)}">Confirmar reserva</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
