<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Pagos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gestión de Pagos</h2>
    <a th:href="@{/admin/pagos/nuevo}" class="btn btn-primary">Nuevo Pago</a>
</div>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Reserva</th>
        <th>Usuario</th>
        <th>Monto</th>
        <th>Método</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${pagos}">
        <td th:text="${p.id}"></td>
        <td th:text="${'#' + p.reserva.id + ' - ' + p.reserva.fecha.toString() + ' ' + p.reserva.hora.toString()}"></td>
        <td th:text="${p.reserva.usuario != null ? p.reserva.usuario.nombre : 'Sin usuario'}"></td>
        <td th:text="${'$' + #numbers.formatDecimal(p.monto, 0, 'POINT', 2, 'COMMA')}"></td>
        <td th:text="${p.metodoPago}"></td>
        <td>
            <span class="badge" th:classappend="${p.estado == 'COMPLETADO'} ? 'bg-success' : 'bg-warning text-dark'"
                  th:text="${p.estado}"></span>
        </td>
        <td>
            <a th:href="@{/admin/pagos/editar/{id}(id=${p.id})}" class="btn btn-warning btn-sm">Editar</a>
            <a th:href="@{/admin/pagos/eliminar/{id}(id=${p.id})}" class="btn btn-danger btn-sm"
               onclick="return confirm('¿Eliminar este pago?');">Eliminar</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(pagos)}">
        <td colspan="7" class="text-center">No hay pagos registrados.</td>
    </tr>
    </tbody>
</table>
</div>
</body>
</html>
