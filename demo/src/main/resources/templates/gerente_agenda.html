<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agenda de mi Barbería | BarberBook.com</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <h2 class="mb-1">Agenda</h2>
    <p class="text-muted" th:text="${barberia.nombre}"></p>

    <form th:action="@{/gerente/agenda}" method="get" class="row g-2 align-items-center mb-4">
        <div class="col-auto">
            <label class="col-form-label">Fecha:</label>
        </div>
        <div class="col-auto">
            <input type="date" name="fecha" th:value="${fecha}" class="form-control" />
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">Consultar</button>
        </div>
    </form>

    <div class="alert alert-secondary">
        Ocupación del <strong th:text="${fecha}"></strong>:
        <strong th:text="${#lists.size(reservas)}"></strong> cita(s).
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Hora</th>
            <th>Barbero</th>
            <th>Cliente</th>
            <th>Servicio</th>
            <th>Espacio</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${reservas}">
            <td th:text="${r.hora}"></td>
            <td th:text="${r.barbero.nombre}"></td>
            <td th:text="${r.usuario.nombre}"></td>
            <td th:text="${r.servicio.nombre}"></td>
            <td th:text="${r.espacio.nombre}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(reservas)}">
            <td colspan="5" class="text-center">Sin citas para esta fecha.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
