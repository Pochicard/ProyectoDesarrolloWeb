<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Reservas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<a th:href="@{/}" class="btn btn-link ps-0">&laquo; Inicio</a>
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Listado de Reservas</h2>
    <a th:href="@{/reservas/nueva}" class="btn btn-primary">Nueva Reserva</a>
</div>

<form th:action="@{/reservas}" method="get" class="row g-2 align-items-center mb-4">
    <div class="col-auto">
        <label class="col-form-label">Usuario:</label>
    </div>
    <div class="col-auto">
        <select name="usuarioId" class="form-select">
            <option value="">-- Todos --</option>
            <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nombre}"
                    th:selected="${u.id == usuarioId}"></option>
        </select>
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-outline-primary">Filtrar</button>
        <a th:href="@{/reservas}" class="btn btn-outline-secondary">Ver todas</a>
    </div>
</form>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Espacio</th>
        <th>Fecha</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="reserva : ${reservas}">
        <td th:text="${reserva.id}"></td>
        <td th:text="${reserva.usuario != null ? reserva.usuario.nombre : 'Sin usuario'}"></td>
        <td th:text="${reserva.espacio != null ? reserva.espacio.nombre : 'Sin espacio'}"></td>
        <td th:text="${reserva.fecha != null ? reserva.fecha : 'Sin fecha'}"></td>

        <td>
            <a th:href="@{/reservas/{id}(id=${reserva.id})}" class="btn btn-info btn-sm">Ver</a>
            <a th:href="@{/reservas/editar/{id}(id=${reserva.id})}" class="btn btn-warning btn-sm">Editar</a>
            <a th:href="@{/reservas/eliminar/{id}(id=${reserva.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar esta reserva?');">Eliminar</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(reservas)}">
        <td colspan="5" class="text-center">No hay reservas registradas.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
