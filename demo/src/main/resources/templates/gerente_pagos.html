<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pagos de mi Barbería | BarberBook.com</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <h2 class="mb-1">Pagos recibidos</h2>
    <p class="text-muted" th:text="${barberia.nombre}"></p>

    <div class="alert alert-success">
        Total recaudado (pagos completados):
        <strong th:text="${'$' + #numbers.formatDecimal(totalRecaudado, 0, 'POINT', 2, 'COMMA')}"></strong>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Servicio</th>
            <th>Fecha</th>
            <th>Monto</th>
            <th>Método</th>
            <th>Estado</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${pagos}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.reserva.usuario.nombre}"></td>
            <td th:text="${p.reserva.servicio.nombre}"></td>
            <td th:text="${p.reserva.fecha}"></td>
            <td th:text="${'$' + #numbers.formatDecimal(p.monto, 0, 'POINT', 2, 'COMMA')}"></td>
            <td th:text="${p.metodoPago}"></td>
            <td>
                <span class="badge" th:classappend="${p.estado == 'COMPLETADO'} ? 'bg-success' : 'bg-warning text-dark'"
                      th:text="${p.estado}"></span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(pagos)}">
            <td colspan="7" class="text-center">Tu barbería aún no ha recibido pagos.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
