<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Reservas | BarberBook.com</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <h2 class="mb-4">Reservas asignadas</h2>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Cliente</th>
            <th>Teléfono</th>
            <th>Servicio</th>
            <th>Espacio</th>
            <th>Fecha</th>
            <th>Hora</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${reservas}">
            <td th:text="${r.usuario.nombre}"></td>
            <td th:text="${r.usuario.telefono}"></td>
            <td th:text="${r.servicio.nombre}"></td>
            <td th:text="${r.espacio.nombre}"></td>
            <td th:text="${r.fecha}"></td>
            <td th:text="${r.hora}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(reservas)}">
            <td colspan="6" class="text-center">No tienes reservas asignadas.</td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/barbero/agenda}" class="btn btn-primary">Ver mi agenda</a>
</div>
</body>
</html>
