<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Servicios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestión de Servicios</h2>
        <a th:href="@{/admin/servicios/nuevo}" class="btn btn-primary">Nuevo Servicio</a>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Barbería</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${servicios}">
            <td th:text="${s.id}"></td>
            <td th:text="${s.barberia.nombre}"></td>
            <td th:text="${s.nombre}"></td>
            <td th:text="${s.descripcion}"></td>
            <td th:text="${'$' + #numbers.formatDecimal(s.precio, 0, 'POINT', 2, 'COMMA')}"></td>
            <td th:text="${s.activo ? 'Activo' : 'Inactivo'}"></td>
            <td>
                <a th:href="@{/admin/servicios/editar/{id}(id=${s.id})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:if="${s.activo}" th:href="@{/admin/servicios/desactivar/{id}(id=${s.id})}"
                   class="btn btn-danger btn-sm" onclick="return confirm('¿Desactivar este servicio?');">Desactivar</a>
                <a th:unless="${s.activo}" th:href="@{/admin/servicios/activar/{id}(id=${s.id})}"
                   class="btn btn-success btn-sm">Activar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(servicios)}">
            <td colspan="7" class="text-center">No hay servicios registrados.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
