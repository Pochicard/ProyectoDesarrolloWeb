<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Usuarios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gestión de Usuarios</h2>
    <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-primary">Nuevo Usuario</a>
</div>

<div class="row g-3 mb-4">
    <div class="col-md-3" th:each="r : ${resumenRoles}">
        <div class="card text-center">
            <div class="card-body">
                <h3 th:text="${r.total}">0</h3>
                <p class="text-muted mb-0" th:text="${r.rol}">ROL</p>
            </div>
        </div>
    </div>
</div>

<form th:action="@{/admin/usuarios}" method="get" class="row g-2 align-items-center mb-4">
    <div class="col-auto">
        <label class="col-form-label">Filtrar por rol:</label>
    </div>
    <div class="col-auto">
        <select name="rol" class="form-select">
            <option value="">-- Todos --</option>
            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                    th:selected="${r == rolFiltro}"></option>
        </select>
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-outline-primary">Filtrar</button>
        <a th:href="@{/admin/usuarios}" class="btn btn-outline-secondary">Ver todos</a>
    </div>
</form>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Teléfono</th>
        <th>Rol</th>
        <th>Barbería</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${usuarios}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.nombre}"></td>
        <td th:text="${u.correo}"></td>
        <td th:text="${u.telefono}"></td>
        <td><span class="badge bg-info text-dark" th:text="${u.rol}"></span></td>
        <td th:text="${u.barberia != null ? u.barberia.nombre : '-'}"></td>
        <td th:text="${u.activo ? 'Activo' : 'Inactivo'}"></td>
        <td>
            <a th:href="@{/admin/usuarios/editar/{id}(id=${u.id})}" class="btn btn-warning btn-sm">Editar</a>
            <a th:if="${u.activo}" th:href="@{/admin/usuarios/desactivar/{id}(id=${u.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Desactivar este usuario?');">Desactivar</a>
            <a th:unless="${u.activo}" th:href="@{/admin/usuarios/activar/{id}(id=${u.id})}" class="btn btn-success btn-sm">Activar</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(usuarios)}">
        <td colspan="8" class="text-center">No hay usuarios registrados.</td>
    </tr>
    </tbody>
</table>
</div>
</body>
</html>
