<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Usuarios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<a th:href="@{/}" class="btn btn-link ps-0">&laquo; Inicio</a>
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gestión de Usuarios</h2>
    <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">Nuevo Usuario</a>
</div>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Teléfono</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${usuarios}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.nombre}"></td>
        <td th:text="${u.correo}"></td>
        <td th:text="${u.telefono}"></td>
        <td th:text="${u.activo ? 'Activo' : 'Inactivo'}"></td>
        <td>
            <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-warning btn-sm">Editar</a>
            <a th:if="${u.activo}" th:href="@{/usuarios/desactivar/{id}(id=${u.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Desactivar este usuario?');">Desactivar</a>
            <a th:unless="${u.activo}" th:href="@{/usuarios/activar/{id}(id=${u.id})}" class="btn btn-success btn-sm">Activar</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(usuarios)}">
        <td colspan="6" class="text-center">No hay usuarios registrados.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
