<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Espacios | BarberBook.com</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gestión de Espacios</h2>
    <a th:href="@{/admin/espacios/nuevo}" class="btn btn-primary">Nuevo Espacio</a>
</div>

<form th:action="@{/admin/espacios}" method="get" class="row g-2 align-items-center mb-4">
    <div class="col-auto">
        <label class="col-form-label">Capacidad mínima:</label>
    </div>
    <div class="col-auto">
        <input type="number" name="capacidadMinima" th:value="${capacidadMinima}" min="1" class="form-control" />
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-outline-primary">Filtrar</button>
        <a th:href="@{/admin/espacios}" class="btn btn-outline-secondary">Ver todos</a>
    </div>
</form>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Barbería</th>
        <th>Nombre</th>
        <th>Capacidad</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="e : ${espacios}">
        <td th:text="${e.id}"></td>
        <td th:text="${e.barberia.nombre}"></td>
        <td th:text="${e.nombre}"></td>
        <td th:text="${e.capacidad}"></td>
        <td th:text="${e.activo ? 'Activo' : 'Inactivo'}"></td>
        <td>
            <a th:href="@{/admin/espacios/editar/{id}(id=${e.id})}" class="btn btn-warning btn-sm">Editar</a>
            <a th:if="${e.activo}" th:href="@{/admin/espacios/desactivar/{id}(id=${e.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Desactivar este espacio?');">Desactivar</a>
            <a th:unless="${e.activo}" th:href="@{/admin/espacios/activar/{id}(id=${e.id})}" class="btn btn-success btn-sm">Activar</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(espacios)}">
        <td colspan="6" class="text-center">No hay espacios registrados.</td>
    </tr>
    </tbody>
</table>

</div>
</body>
</html>
