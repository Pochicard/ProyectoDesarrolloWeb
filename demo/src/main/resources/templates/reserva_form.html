<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Reserva</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 th:text="${reserva.id == null ? 'Registrar Reserva' : 'Editar Reserva'}">Reserva</h4>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/reservas/guardar}" th:object="${reserva}" method="post">
                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-3">
                        <label class="form-label">Fecha:</label>
                        <input type="date" th:field="*{fecha}" class="form-control" required />
                        <div class="text-danger" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Hora:</label>
                        <input type="time" th:field="*{hora}" class="form-control" required />
                        <div class="text-danger" th:if="${#fields.hasErrors('hora')}" th:errors="*{hora}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Cliente:</label>
                        <select th:field="*{usuario.id}" class="form-select" required>
                            <option value="">-- Seleccionar Cliente --</option>
                            <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nombre}"></option>
                        </select>
                        <div class="text-danger" th:if="${#fields.hasErrors('usuario')}" th:errors="*{usuario}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Barbero:</label>
                        <select th:field="*{barbero.id}" class="form-select" required>
                            <option value="">-- Seleccionar Barbero --</option>
                            <option th:each="b : ${barberos}" th:value="${b.id}" th:text="${b.nombre}"></option>
                        </select>
                        <div class="text-danger" th:if="${#fields.hasErrors('barbero')}" th:errors="*{barbero}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Servicio:</label>
                        <select th:field="*{servicio.id}" class="form-select" required>
                            <option value="">-- Seleccionar Servicio --</option>
                            <option th:each="s : ${servicios}" th:value="${s.id}" th:text="${s.nombre}"></option>
                        </select>
                        <div class="text-danger" th:if="${#fields.hasErrors('servicio')}" th:errors="*{servicio}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Espacio:</label>
                        <select th:field="*{espacio.id}" class="form-select" required>
                            <option value="">-- Seleccionar Espacio --</option>
                            <option th:each="e : ${espacios}" th:value="${e.id}" th:text="${e.nombre}"></option>
                        </select>
                        <div class="text-danger" th:if="${#fields.hasErrors('espacio')}" th:errors="*{espacio}"></div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/admin/reservas}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar Reserva</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</div>
</body>
</html>
